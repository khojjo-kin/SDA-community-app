name: TestFlight

# Builds the iPhone app on Expo's build service and sends it to TestFlight.
# Run it from the Actions tab ("Run workflow"), or push a tag like v1.0.1.
#
# Before the first run:
#   1. Add a repository secret named EXPO_TOKEN (expo.dev -> Account settings -> Access tokens).
#   2. Make one build by hand from a computer (see README, "First TestFlight build"),
#      so Expo can store the signing certificate and App Store Connect key for this app.

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - name: Install packages
        run: npm install --no-audit --no-fund
      - name: Build and submit to TestFlight
        run: eas build --platform ios --profile production --non-interactive --auto-submit --no-wait
