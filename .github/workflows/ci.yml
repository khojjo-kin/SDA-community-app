name: Check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install packages
        run: npm install --no-audit --no-fund
      - name: Check package versions match this Expo SDK
        run: npx expo install --check
        continue-on-error: true
      - name: Type check
        run: npx tsc --noEmit
        continue-on-error: true
      - name: Bundle the app for iOS
        run: npx expo export --platform ios --output-dir .export-check
