name: Community for Mac on TestFlight

# Builds the desktop app (desktop/) for the Mac App Store and uploads it to TestFlight, as the
# macOS version of the same App Store Connect app as the iPhone app (Kojo.SDAAPPGEMINI). Runs when
# the desktop-testflight branch is pushed (push the desktop branch there to send a build).
# The App Store Connect key and the distribution certificate are the iPhone build's, read from the
# community-app branch.
on:
  push:
    branches: [desktop-testflight]

permissions:
  contents: write

concurrency:
  group: desktop-testflight
  cancel-in-progress: true

env:
  ASC_KEY_ID: PD6DWK7T4C
  ASC_ISSUER_ID: 232fdb99-c796-444e-8430-34452fd67484

jobs:
  testflight:
    name: Mac App Store build
    runs-on: macos-15
    timeout-minutes: 60
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Collect the Apple key and certificate
        run: |
          git fetch --quiet --depth 1 origin community-app
          mkdir -p "$RUNNER_TEMP/signing"
          git show FETCH_HEAD:ios/fastlane/AuthKey_PD6DWK7T4C.p8 > "$RUNNER_TEMP/signing/key.p8"
          git show FETCH_HEAD:ios/PRZR6A95J9.p12 > "$RUNNER_TEMP/signing/dist.key" || true
          git show FETCH_HEAD:ios/PRZR6A95J9.cer > "$RUNNER_TEMP/signing/dist.cer" || true
          chmod 600 "$RUNNER_TEMP"/signing/*
          echo "ASC_KEY_PATH=$RUNNER_TEMP/signing/key.p8" >> "$GITHUB_ENV"
          echo "SIGN_DIR=$RUNNER_TEMP/signing" >> "$GITHUB_ENV"
          pip3 install --quiet --break-system-packages pyjwt cryptography || pip3 install --quiet pyjwt cryptography
      - name: What App Store Connect has
        run: |
          mkdir -p "$RUNNER_TEMP/logs"
          python3 scripts/mas-probe.py 2>&1 | tee "$RUNNER_TEMP/logs/probe.txt"
      - name: Remove the key
        if: always()
        run: rm -rf "$RUNNER_TEMP/signing"
      # The logs go to the desktop-build-logs branch (under mac-testflight/), so they can be read
      # without the Actions page.
      - name: Save logs
        if: always()
        run: |
          cd "$RUNNER_TEMP"
          rm -rf logrepo && git clone --quiet --depth 1 --branch desktop-build-logs "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" logrepo 2>/dev/null || { mkdir logrepo && cd logrepo && git init -q -b desktop-build-logs && git remote add origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" && cd ..; }
          mkdir -p logrepo/mac-testflight && rm -rf logrepo/mac-testflight/* && cp -R logs/. logrepo/mac-testflight/ 2>/dev/null || true
          echo "${{ github.sha }} run ${{ github.run_number }} ${{ job.status }}" > logrepo/mac-testflight/LATEST.txt
          cd logrepo && git add -A && git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -q -m "Mac TestFlight logs, run ${{ github.run_number }}" && git push -q origin desktop-build-logs
